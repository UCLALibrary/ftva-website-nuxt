name: Production Site Build

# This controls how the run is labeled in the GitHub UI
run-name: >
  Production Build -
  ${{ github.event_name == 'release'
      && format('release {0}', github.ref_name)
      || github.event_name == 'schedule'
      && 'latest tag (scheduled)'
      || format('tag {0} (manual)', inputs.ref) }}

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to deploy (example: 2.2.1)"
        required: true
        type: string

  schedule:
    - cron: '0 17 * * *'  # 09:00 America/Los_Angeles (PST, UTC-8)
    - cron: '0 23 * * *'  # 15:00 America/Los_Angeles (PST, UTC-8)

jobs:
  nuxt-prod:
    name: Netlify deploy
    runs-on: ubuntu-latest

    steps:

      # Step 1: Always checkout repo so local actions and tags are available
      - name: Checkout repo (for local actions and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Discover latest tag for scheduled builds
      - name: Get Latest Tag (schedule)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "CURRENT_REF=$LATEST_TAG" >> $GITHUB_ENV
          echo "Latest tag is: $LATEST_TAG"

      # Step 3: For manual builds, CURRENT_REF = manually selected tag
      - name: Set CURRENT_REF for manual build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "CURRENT_REF=${{ inputs.ref }}" >> $GITHUB_ENV
          echo "Manual tag ref: ${{ inputs.ref }}"

      # Step 4: For release builds, CURRENT_REF = release tag
      - name: Set CURRENT_REF for release
        if: ${{ github.event_name == 'release' }}
        run: |
          echo "CURRENT_REF=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "Release tag ref: ${GITHUB_REF_NAME}"

      # Step 5: Checkout the ref we want and install deps
      - name: Set up workspace (checkout ref + install deps)
        uses: ./.github/workflows/setup-workspace
        with:
          ref: ${{ env.CURRENT_REF }}

      # Step 6: Capture real ref for labeling + caching
      - name: Capture current ref info
        run: |
          echo "CURRENT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "CURRENT_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "CURRENT_REF=$(git describe --tags --always)" >> $GITHUB_ENV

          echo "Building ref: $(git describe --tags --always)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Short:  $(git rev-parse --short HEAD)"

      # Step 7: Cache build
      - name: Cache built static site
        id: cache-nuxt3
        uses: actions/cache@v3
        with:
          path: .output/public
          key: nuxt3-site-${{ env.CURRENT_SHORT_SHA || github.sha }}

      # Step 8: Build Nuxt site
      - name: Generate Nuxt static site
        id: nuxt-generate
        run: |
          set -o pipefail
          pnpm run generate 2>&1 | tee nuxt-build.log
        env:
          CRAFT_ENDPOINT: ${{ secrets.CRAFT_PROD_ENDPOINT }}
          S3_BUCKET: "https://static.library.ucla.edu/"
          SITEMAP_HOST: "https://cinema.ucla.edu"
          ES_URL: ${{ secrets.ES_URL }}
          ES_READ_KEY: ${{ secrets.ES_READ_KEY_PROD }}
          ES_WRITE_KEY: ${{ secrets.ES_WRITE_KEY_PROD }}
          ES_ALIAS: ${{ secrets.ES_ALIAS_PROD }}
          ES_INDEX_PREFIX: ${{ secrets.ES_INDEX_PREFIX_PROD }}

      # Step 9: Analyze Nuxt build errors
      - name: Analyze Nuxt build errors
        id: analyze-nuxt
        if: always()
        run: |
          echo "===== Build error summary ====="

          ES_INDEX_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[INDEX-CREATION\]' nuxt-build.log || true)
          ES_INDEX_CHECK_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[INDEX-CHECK\]' nuxt-build.log || true)
          ES_ALIAS_READ_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[ALIAS-READ\]' nuxt-build.log || true)
          ES_ALIAS_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[ALIAS-UPDATE\]' nuxt-build.log || true)
          ES_ALIAS_SKIPPED=$(grep -c '\[BUILD-WARNING\]\[ELASTICSEARCH\]\[ALIAS-SKIPPED\]' nuxt-build.log || true)

          PRERENDER_5XX_ERRORS=$(grep -c '\[BUILD-ERROR\]\[PRERENDER\]\[5XX\]' nuxt-build.log || true)

          PRERENDER_5XX_DETAILS=$(
            grep '\[BUILD-ERROR\]\[PRERENDER\]\[5XX\]' nuxt-build.log |
            sed -E 's/.*\[5XX\] //' |
            jq -r '"\(.route) | \(.message // .statusMessage // "")"' ||
            true
          )

          PRERENDER_404_WARNINGS=$(grep -c '\[BUILD-WARNING\]\[PRERENDER\]\[404\]' nuxt-build.log || true)

          echo "ES index creation errors: $ES_INDEX_ERRORS"
          echo "ES index check errors: $ES_INDEX_CHECK_ERRORS"
          echo "ES alias read errors: $ES_ALIAS_READ_ERRORS"
          echo "ES alias update errors: $ES_ALIAS_ERRORS"
          echo "ES alias skipped: $ES_ALIAS_SKIPPED"
          echo "Prerender 5xx errors: $PRERENDER_5XX_ERRORS"
          echo "Prerender 404 warnings: $PRERENDER_404_WARNINGS"

          echo "es_index_errors=$ES_INDEX_ERRORS" >> "$GITHUB_OUTPUT"
          echo "es_index_check_errors=$ES_INDEX_CHECK_ERRORS" >> "$GITHUB_OUTPUT"
          echo "es_alias_read_errors=$ES_ALIAS_READ_ERRORS" >> "$GITHUB_OUTPUT"
          echo "es_alias_errors=$ES_ALIAS_ERRORS" >> "$GITHUB_OUTPUT"
          echo "es_alias_skipped=$ES_ALIAS_SKIPPED" >> "$GITHUB_OUTPUT"
          echo "prerender_5xx_errors=$PRERENDER_5XX_ERRORS" >> "$GITHUB_OUTPUT"
          echo "prerender_404_warnings=$PRERENDER_404_WARNINGS" >> "$GITHUB_OUTPUT"

          {
            echo "prerender_5xx_details<<EOF"
            printf '%s\n' "$PRERENDER_5XX_DETAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "===== Failed 5xx routes ====="
          printf '%s\n' "$PRERENDER_5XX_DETAILS"

          echo
          echo "===== 404 warnings ====="
          grep '\[BUILD-WARNING\]\[PRERENDER\]\[404\]' nuxt-build.log || true

          echo
          echo "===== Relevant Elasticsearch messages ====="
          grep -E '\[BUILD-(ERROR|WARNING)\]\[ELASTICSEARCH\]' nuxt-build.log || true

          if [ "$PRERENDER_5XX_ERRORS" -gt 0 ] ||
             [ "$ES_INDEX_ERRORS" -gt 0 ] ||
             [ "$ES_INDEX_CHECK_ERRORS" -gt 0 ] ||
             [ "$ES_ALIAS_READ_ERRORS" -gt 0 ] ||
             [ "$ES_ALIAS_ERRORS" -gt 0 ]; then
            echo "should_notify_slack=true" >> "$GITHUB_OUTPUT"
            echo "Slack notification: YES"
          else
            echo "should_notify_slack=false" >> "$GITHUB_OUTPUT"
            echo "Slack notification: NO"
          fi

      # Step 10: Create Slack payload
      - name: Create Slack payload
        if: steps.analyze-nuxt.outputs.should_notify_slack == 'true'
        env:
          FAILED_5XX_ROUTES: ${{ steps.analyze-nuxt.outputs.prerender_5xx_details }}
          PRERENDER_5XX_COUNT: ${{ steps.analyze-nuxt.outputs.prerender_5xx_errors }}
          ES_INDEX_ERRORS: ${{ steps.analyze-nuxt.outputs.es_index_errors }}
          ES_INDEX_CHECK_ERRORS: ${{ steps.analyze-nuxt.outputs.es_index_check_errors }}
          ES_ALIAS_READ_ERRORS: ${{ steps.analyze-nuxt.outputs.es_alias_read_errors }}
          ES_ALIAS_ERRORS: ${{ steps.analyze-nuxt.outputs.es_alias_errors }}
          ES_ALIAS_SKIPPED: ${{ steps.analyze-nuxt.outputs.es_alias_skipped }}
        run: |
          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg ref "${{ env.CURRENT_REF }}" \
            --arg sha "${{ env.CURRENT_SHORT_SHA }}" \
            --arg status "${{ steps.nuxt-generate.outcome }}" \
            --arg count "$PRERENDER_5XX_COUNT" \
            --arg routes "$FAILED_5XX_ROUTES" \
            --arg es_index "$ES_INDEX_ERRORS" \
            --arg es_check "$ES_INDEX_CHECK_ERRORS" \
            --arg es_alias_read "$ES_ALIAS_READ_ERRORS" \
            --arg es_alias "$ES_ALIAS_ERRORS" \
            --arg es_skipped "$ES_ALIAS_SKIPPED" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "FTVA Production Build",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: (
                      "⚠️ FTVA Production Build completed with warnings\n\n" +
                      "Repository: `" + $repository + "`\n" +
                      "Ref: `" + $ref + "`\n" +
                      "Commit: `" + $sha + "`\n" +
                      "Nuxt generate status: `" + $status + "`\n\n" +
                      "*Nuxt / Data*\n" +
                      "• 5xx prerender errors: `" + $count + "`\n\n" +
                      "*Failed 5xx routes:*\n" +
                      $routes + "\n\n" +
                      "*Elasticsearch*\n" +
                      "• Index creation errors: `" + $es_index + "`\n" +
                      "• Index check errors: `" + $es_check + "`\n" +
                      "• Alias read errors: `" + $es_alias_read + "`\n" +
                      "• Alias update errors: `" + $es_alias + "`\n" +
                      "• Alias skipped: `" + $es_skipped + "`\n\n" +
                      "<" + $run_url + "|View GitHub Actions run>"
                    )
                  }
                }
              ]
            }' > slack-payload.json

      # Step 11: Notify Slack
      - name: Notify Slack
        if: steps.analyze-nuxt.outputs.should_notify_slack == 'true'
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.LADI_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./slack-payload.json

      # Step 12: Deploy
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          production-deploy: true
          deploy-message: "Build from ${{ env.CURRENT_REF }} (commit ${{ env.CURRENT_SHORT_SHA }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-dir: .output/public
          fails-without-credentials: true
          github-deployment-environment: production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_FTVA_SITE_ID }}
