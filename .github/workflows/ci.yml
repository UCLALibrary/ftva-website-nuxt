name: Run CI Suite

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
concurrency:
    group: ci-${{ github.ref_name=='main' && github.sha || github.ref_name }} # Cancel runs for previous version of PR, but not main (after merge). For hacked ternary, see https://github.com/actions/runner/issues/409#issuecomment-727565588
    cancel-in-progress: true
jobs:
    eslint:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v3
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
            - uses: ./.github/workflows/setup-workspace
            - run: pnpm run lint

    chromatic-instructions:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
          - name: Comment with Chromatic instructions
            uses: bubkoo/auto-comment@v1
            with:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              pullRequestOpened: >
                # Chromatic Visual Tests (Cypress)

                To conserve our visual snapshot budget, Chromatic is not configured to run automatically.
                When the PR is ready and other checks are passing, run it manually:

                1. Visit the workflow: https://github.com/UCLALibrary/ftva-website-nuxt/actions/workflows/chromatic.yml
                2. Click **Run workflow**
                3. Select the correct branch for this PR and click **Run workflow** again

    nuxt:
        name: Nuxt build / Cypress tests / Netlify deploy
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v3
            - uses: ./.github/workflows/setup-workspace
            - name: Set deployment date
              id: set-deploy-date
              run: echo "DEPLOY_DATE=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV

            - name: Sets env vars for PR preview
              run: |
                  echo "ES_ALIAS=${{secrets.ES_ALIAS_TEST}}-deploy-preview-${{github.event.pull_request.number}}" >> $GITHUB_ENV
              if: github.ref_name!='main'
            - name: Sets env vars for main merge
              run: |
                  echo "ES_ALIAS=${{secrets.ES_ALIAS_TEST}}" >> $GITHUB_ENV
              if: github.ref_name=='main'

            - name: Cache Nuxt build cache
              uses: actions/cache@v3
              with:
                path: |
                  .nuxt/cache
                  node_modules/.vite
                key: ${{ runner.os }}-nuxt-build-${{ hashFiles('nuxt.config.ts', '**/*.vue', '**/*.ts') }}
                restore-keys: |
                  ${{ runner.os }}-nuxt-build-

            - name: Generate Nuxt static site
              id: nuxt-generate
              run: |
                set -o pipefail
                pnpm run generate 2>&1 | tee nuxt-build.log
              env:
                  CRAFT_ENDPOINT: ${{ secrets.CRAFT_ENDPOINT_TEST }}
                  S3_BUCKET: "https://static.library.ucla.edu/"
                  SITEMAP_HOST: "https://test-ftva.library.ucla.edu"
                  ES_URL: ${{ secrets.ES_URL }}
                  ESApiKey: ${{ secrets.ESApiKey }}
                  ES_READ_KEY: ${{ secrets.ES_READ_KEY_TEST }}
                  ES_WRITE_KEY: ${{ secrets.ES_WRITE_KEY_TEST }}
                  ES_ALIAS: ${{ env.ES_ALIAS }}
                  ES_INDEX_PREFIX: ${{secrets.ES_INDEX_PREFIX_TEST}}

            - name: Analyze Nuxt build errors
              id: analyze-nuxt
              if: always()
              run: |
                echo "===== Build error summary ====="

                ES_INDEX_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[INDEX-CREATION\]' nuxt-build.log || true)
                ES_INDEX_CHECK_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[INDEX-CHECK\]' nuxt-build.log || true)
                ES_ALIAS_READ_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[ALIAS-READ\]' nuxt-build.log || true)
                ES_ALIAS_ERRORS=$(grep -c '\[BUILD-ERROR\]\[ELASTICSEARCH\]\[ALIAS-UPDATE\]' nuxt-build.log || true)
                ES_ALIAS_SKIPPED=$(grep -c '\[BUILD-WARNING\]\[ELASTICSEARCH\]\[ALIAS-SKIPPED\]' nuxt-build.log || true)

                PRERENDER_5XX_ERRORS=$(grep -c '\[BUILD-ERROR\]\[PRERENDER\]\[5XX\]' nuxt-build.log || true)
                PRERENDER_404_WARNINGS=$(grep -c '\[BUILD-WARNING\]\[PRERENDER\]\[404\]' nuxt-build.log || true)

                echo "ES index creation errors: $ES_INDEX_ERRORS"
                echo "ES index check errors: $ES_INDEX_CHECK_ERRORS"
                echo "ES alias read errors: $ES_ALIAS_READ_ERRORS"
                echo "ES alias update errors: $ES_ALIAS_ERRORS"
                echo "ES alias skipped: $ES_ALIAS_SKIPPED"
                echo "Prerender 5xx errors: $PRERENDER_5XX_ERRORS"
                echo "Prerender 404 warnings: $PRERENDER_404_WARNINGS"

                echo "es_index_errors=$ES_INDEX_ERRORS" >> "$GITHUB_OUTPUT"
                echo "es_index_check_errors=$ES_INDEX_CHECK_ERRORS" >> "$GITHUB_OUTPUT"
                echo "es_alias_read_errors=$ES_ALIAS_READ_ERRORS" >> "$GITHUB_OUTPUT"
                echo "es_alias_errors=$ES_ALIAS_ERRORS" >> "$GITHUB_OUTPUT"
                echo "es_alias_skipped=$ES_ALIAS_SKIPPED" >> "$GITHUB_OUTPUT"
                echo "prerender_5xx_errors=$PRERENDER_5XX_ERRORS" >> "$GITHUB_OUTPUT"
                echo "prerender_404_warnings=$PRERENDER_404_WARNINGS" >> "$GITHUB_OUTPUT"

                echo
                echo "===== Failed 5xx routes ====="
                grep '\[BUILD-ERROR\]\[PRERENDER\]\[5XX\]' nuxt-build.log || true

                echo
                echo "===== 404 warnings ====="
                grep '\[BUILD-WARNING\]\[PRERENDER\]\[404\]' nuxt-build.log || true

                echo
                echo "===== Relevant Elasticsearch messages ====="
                grep -E '\[BUILD-(ERROR|WARNING)\]\[ELASTICSEARCH\]' nuxt-build.log || true

                if [ "$PRERENDER_5XX_ERRORS" -gt 0 ] || \
                  [ "$ES_INDEX_ERRORS" -gt 0 ] || \
                  [ "$ES_INDEX_CHECK_ERRORS" -gt 0 ] || \
                  [ "$ES_ALIAS_READ_ERRORS" -gt 0 ] || \
                  [ "$ES_ALIAS_ERRORS" -gt 0 ]; then
                  echo "should_notify_slack=true" >> "$GITHUB_OUTPUT"
                  echo "Slack notification: YES"
                else
                  echo "should_notify_slack=false" >> "$GITHUB_OUTPUT"
                  echo "Slack notification: NO"
                fi

            - name: Notify Slack
              if: steps.analyze-nuxt.outputs.should_notify_slack == 'true'
              uses: slackapi/slack-github-action@v4
              with:
                webhook: ${{ secrets.LADI_SLACK_WEBHOOK_URL }}
                webhook-type: incoming-webhook
                payload: |
                  text: "FTVA Nuxt Generate"
                  blocks:
                    - type: section
                      text:
                        type: mrkdwn
                        text: |
                          ⚠️ FTVA Nuxt Generate completed with warnings

                          Repository: `${{ github.repository }}`
                          PR: #${{ github.event.pull_request.number }}
                          PR branch: `${{ github.head_ref || github.ref_name }}`
                          Nuxt generate status: `${{ steps.nuxt-generate.outcome }}`

                          *Nuxt / Data*
                          • 5xx prerender errors: `${{ steps.analyze-nuxt.outputs.server_errors }}`

                          *Failed 5xx routes:*
                          ${{ steps.analyze-nuxt.outputs.failed_5xx_routes }}

                          *Elasticsearch*
                          • Index creation errors: `${{ steps.analyze-nuxt.outputs.es_index_errors }}`
                          • Index check errors: `${{ steps.analyze-nuxt.outputs.es_index_check_errors }}`
                          • Alias read errors: `${{ steps.analyze-nuxt.outputs.es_alias_read_errors }}`
                          • Alias update errors: `${{ steps.analyze-nuxt.outputs.es_alias_errors }}`
                          • Alias skipped: `${{ steps.analyze-nuxt.outputs.es_alias_skipped }}`

                          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions run>


            - name: Deploy to Netlify (preview)
              if: github.ref_name!='main'
              uses: nwtgck/actions-netlify@v3.0 #
              with:
                  production-deploy: false
                  deploy-message: |
                    Deploy preview for PR #${{ github.event.pull_request.number }}: Date: ${{ env.DEPLOY_DATE }}
                    Commit ${{ github.event.pull_request.head.sha }} - https://github.com/UCLALibrary/library-website-nuxt/commit/${{ github.event.pull_request.head.sha }}
                    Pull Request: https://github.com/UCLALibrary/library-website-nuxt/pull/${{ github.event.pull_request.number }}
                  alias: deploy-preview-${{ github.event.pull_request.number }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  overwrites-pull-request-comment: true
                  publish-dir: .output/public
                  fails-without-credentials: true
                  github-deployment-environment: ${{ github.event_name }}-${{ github.event.number }}
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TEST_FTVA_SITE_ID }}

            - name: Debug Cypress module resolution
              run: |
                echo "PWD=$(pwd)"
                git rev-parse --short HEAD

                echo "Support files:"
                find cypress/support -maxdepth 1 -type f | sort

                echo "E2E files:"
                find cypress/e2e -maxdepth 1 -type f | sort

                echo "Resolve support imports:"
                node -e "console.log('commands:', require('fs').existsSync('./cypress/support/commands.ts'))"
                node -e "console.log('a11y:', require('fs').existsSync('./cypress/support/a11y.ts'))"
                node -e "console.log('viewports:', require('fs').existsSync('./cypress/support/viewports.ts'))"

            - name: Verify Cypress Installation
              run: pnpm exec cypress verify
            - uses: cypress-io/github-action@v3
              with:
                  start: pnpm dlx serve .output/public
                  install: false
                  wait-on: http://127.0.0.1:3000
                  wait-on-timeout: 110
              env:
                  CRAFT_ENDPOINT: ${{ secrets.CRAFT_ENDPOINT_TEST }}
                  S3_BUCKET: "https://static.library.ucla.edu/"
                  SITEMAP_HOST: "https://test-ftva.library.ucla.edu"
                  ES_URL: ${{ secrets.ES_URL }}
                  ESApiKey: ${{ secrets.ESApiKey }}
                  ES_READ_KEY: ${{ secrets.ES_READ_KEY_TEST }}
                  ES_WRITE_KEY: ${{ secrets.ES_WRITE_KEY_TEST }}
                  ES_INDEX_PREFIX: ${{secrets.ES_INDEX_PREFIX_TEST}}

            - name: Deploy to Netlify (test)
              if: github.ref_name=='main'
              uses: nwtgck/actions-netlify@v2 #
              with:
                  production-deploy: true
                  deploy-message: "Deploy to test on merge to main Date: ${{ env.DEPLOY_DATE }} for commit ${{ github.sha }}: https://github.com/UCLALibrary/library-website-nuxt/commit/${{ github.sha }}"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  publish-dir: .output/public
                  fails-without-credentials: true
                  github-deployment-environment: testing
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TEST_FTVA_SITE_ID }}

